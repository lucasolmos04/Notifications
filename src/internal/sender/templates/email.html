<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notification</title>
<style>
  html, body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
  table, td { border-collapse: collapse; mso-table-lspace: 0; mso-table-rspace: 0; }
  img { border: 0; outline: 0; line-height: 100%; }
</style>
</head>
<body style="margin:0; padding:0; background-color:#616b52; font-family:'Inter', Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#616b52;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#fffefa; border-radius:8px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="background-color:#363f29; padding:20px 28px;">
              <span style="font-family:'Bricolage Grotesque', Arial, Helvetica, sans-serif; color:#ffffff; font-size:20px; font-weight:500;">
                Notifications
              </span>
            </td>
          </tr>

          <!-- Title -->
          <tr>
            <td style="padding:32px 28px 8px;">
              <span style="font-family:'Bricolage Grotesque', Arial, Helvetica, sans-serif; color:#121311; font-size:26px; font-weight:500; line-height:130%;">
                {{.Title}}
              </span>
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding:8px 28px 32px;">
              <span style="font-family:'Inter', Arial, Helvetica, sans-serif; color:#525252; font-size:16px; line-height:150%;">
                {{.Content}}
              </span>
            </td>
          </tr>

          <!-- Accent divider -->
          <tr>
            <td style="padding:0 28px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr><td height="4" style="background-color:#c3e195; border-radius:999px; line-height:4px; font-size:4px;">&nbsp;</td></tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 28px 28px;">
              <span style="font-family:'Inter', Arial, Helvetica, sans-serif; color:#a0a0a0; font-size:12px; line-height:150%;">
                Recibiste este email porque tenés una cuenta activa en nuestra plataforma.
              </span>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
